# Packaging metadata for the BVFF fitting code.
#
# Everything lives under the single `bvff` package (bvff.core / bvff.parsers /
# bvff.tools). Install editable (`pip install -e .`) so imports and the
# `bvff-*` commands work from any directory.

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bvff"
version = "0.1.0"
description = "Bond-valence force field (BV/BVV + Ewald) fitting for ferroelectrics against AIMD/DFT data"
requires-python = ">=3.11"   # tomllib
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "joblib",
    "tomli-w",
]

[project.optional-dependencies]
vasp    = ["pymatgen"]           # vasprun.xml reader
parquet = ["pandas", "pyarrow"]  # long-format AIMD parquet reader
plot    = ["matplotlib"]         # bvff/tools/analysis.py figures
test    = ["pytest"]

[project.scripts]
bvff-fit             = "bvff.core.main:main"
bvff-export-lammps   = "bvff.tools.export_lammps:main"
bvff-ferroelectric   = "bvff.tools.ferroelectric:_demo"
bvff-tc-scan         = "bvff.tools.tc_scan:_main"
bvff-benchmark       = "bvff.tools.benchmark:main"
bvff-gen-controls    = "bvff.tools.gen_controls:main"
bvff-gen-poscars     = "bvff.tools.gen_poscars:main"
bvff-gen-dft-dataset = "bvff.tools.gen_dft_dataset:main"
bvff-vasprun2data    = "bvff.tools.vasprun2data:main"

[tool.setuptools.packages.find]
include = ["bvff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
