# PbTiO3 Buckingham refit seed (Phase 0 experiment).
#
# Same reduced effective charges and Brown-Altermatt BV/BVV seeds as the root
# parameters.toml; the r^-12 [repulsive] block is REPLACED by Born-Mayer +
# dispersion [buckingham] pairs. Rationale: the r^-12 fit saturated its bounds
# (repulsive O-Ti collapsed to ~1e-32 — no Ti-O short-range wall), the exact
# failure mode examples/PbTiO3/dft_set/README.md predicts for a stiff r^-12
# wall against Coulomb; Born-Mayer is softer and can balance it.
#
# Buckingham seeds are literature shell-model Born-Mayer values (Catlow-style
# O-O; Pb-O/Ti-O from the perovskite potential literature). They assume formal
# charges, so with the reduced charges here the fit (Tikhonov-anchored to this
# seed) is expected to soften A / adjust rho rather than reproduce them.
cutoff = 6.0

[coulomb]
Pb =  1.4
Ti =  1.0
O  = -0.8

[buckingham.O-O]
A   = 22764.0
rho = 0.149
C   = 27.88

[buckingham.O-Pb]
A   = 4510.0
rho = 0.32
C   = 0.0

[buckingham.O-Ti]
A   = 2549.4
rho = 0.299
C   = 0.0

[BV.species.Pb]
V0 = 2.0
S  = 0.5

[BV.species.Ti]
V0 = 4.0
S  = 0.5

[BV.species.O]
V0 = 2.0
S  = 0.5

[BV.pairs.O-Pb]
r0 = 2.112
C  = 6.0
b  = 0.37

[BV.pairs.O-Ti]
r0 = 1.815
C  = 5.2
b  = 0.37

[BVV.Pb]
W0 = 0.5
D  = 0.1

[BVV.Ti]
W0 = 0.3
D  = 0.1

[BVV.O]
W0 = 0.0
D  = 0.0

[BVV.pairs.O-Pb]
r0 = 2.112
C  = 6.0
b  = 0.37

[BVV.pairs.O-Ti]
r0 = 1.815
C  = 5.2
b  = 0.37
